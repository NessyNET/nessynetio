slug = "nessy-theme"
name = "nessy-theme"
category = "linux"
status = "active"
summary = "The colour theme this site uses, for terminals and editors."
priority = 2
updated = 2026-11-01
version = "1.0.0"
licence = "MIT"
tags = ["theme"]
source = { host = "GitHub", url = "https://example.com/nessy-theme" }
description = """
One palette, shipped as config files for kitty, a few editors and the shell prompt.
"""

[linux]
language = "TOML"
needs = []

[[linux.install]]
method = "kitty"
command = "kitty +kitten themes --reload-in=all Nessy"

[[linux.install]]
method = "VS Code"
steps = ["Copy the `dist/vscode` folder to `~/.vscode/extensions/nessy-theme`.", "Restart the editor and choose Nessy.", "Use a literal \\` and <b>no markup</b> here."]
note = "Add `include nessy.conf` to the settings if the theme does not appear."

[linux.usage]
synopsis = "cp kitty/nessy.conf ~/.config/kitty/themes/"
example = "kitty +kitten themes --reload-in=all Nessy"

[[get]]
kind = "install"

[[get]]
kind = "download"
url = "https://example.com/downloads/nessy-theme-1.0.0.tar.gz"
