slug = "peat-top"
name = "peat-top"
category = "linux"
status = "active"
summary = "A tiny process and GPU monitor for the terminal."
priority = 3
updated = 2026-07-07
version = "0.3.0"
licence = "MIT"
tags = ["tui", "aur"]
description = """
Shows the busiest processes and the GPU load in one screen. It stays small on purpose: no config file and no plugins.
"""

[linux]
language = "Rust"
needs = ["a terminal with true colour"]

[[linux.install]]
method = "Arch Linux (AUR)"
command = "yay -S peat-top"

[linux.usage]
synopsis = "peat-top [options]"
example = "peat-top --interval 2"
options = [{ flag = "--interval <s>", help = "refresh interval in seconds" }]

[[get]]
kind = "install"
