bio = "I'm Nessy. I build small tools when a game or a desktop annoys me enough, and I keep them free. This is a deliberately long bio for the mock: it goes on about raid nights, Arch updates, peat bogs and the joy of a good terminal colour scheme, well past the suggested limit, to show that the layout still holds and that the build warns about it. Most of what is here started as something for me or my FC; if it helps you too, great."

