mods = [
  { name = "Peatmoss", version = "0.6.0", mine = true },
  { name = "Bracken Biomes", version = "1.2.0", mine = true },
  { name = "Sodium", version = "0.6.x", url = "https://example.com/sodium", mine = false },
  { name = "Lithium", version = "0.14.x", url = "https://example.com/lithium", mine = false },
  { name = "Mod Menu", version = "11.x", url = "https://example.com/mod-menu", mine = false },
]

[[get]]
kind = "external"
label = "Modrinth"
url = "https://example.com/modrinth/highland-pack"

[[get]]
kind = "download"
label = "download .mrpack"
