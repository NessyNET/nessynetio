#:schema ../../schema/project.json
sample = true
slug = "highland-pack"
name = "Highland Pack"
category = "minecraft"
status = "active"
summary = "A calm survival pack built around Peatmoss and Bracken Biomes. [sample]"
priority = 3
updated = 2026-10-20
version = "1.4.0"
