#:schema ../../schema/project.json
slug = "storage-analyzer"
name = "storage-analyzer"
category = "linux"
status = "active"
summary = "A disk-usage TUI with a directory tree and a treemap that fill in live while it scans."
priority = 1
updated = 2026-11-21
version = "0.1.0"
tags = ["tui"]
source = { host = "GitHub", url = "https://github.com/tnessy/storage-analyzer" }
description = """
Point it at a folder and see where the space goes. It scans in the background and the interface stays responsive, with a directory tree, a treemap of the current folder, a file-type breakdown and a list of the largest files, all updating as results arrive.

The layout is inspired by WinDirStat and WizTree. You can delete files and folders from inside it, always after a confirmation that shows the path, size and file count. Nothing else is ever modified.
"""

[linux]
language = "Rust"
needs = []

[[linux.install]]
method = "Cargo (crates.io)"
command = "cargo install storage-analyzer"
note = "Needs Rust 1.99 or newer."

[linux.usage]
synopsis = "storage-analyzer [OPTIONS] [PATH]"
example = "storage-analyzer ~"
options = [
  { flag = "-x, --one-file-system", help = "stay on the root's filesystem" },
  { flag = "--cross-filesystems", help = "descend into every filesystem, including proc, sys and network mounts" },
  { flag = "--apparent", help = "show apparent size instead of disk usage" },
  { flag = "--threads <N>", help = "number of scan threads" },
  { flag = "--top <N>", help = "number of entries in the largest-files view" },
  { flag = "--history", help = "remember scans between sessions" },
]

[[screenshots]]
file = "01.png"
caption = "Folder tree view with map visualizer"

[[screenshots]]
file = "02.png"
caption = "Breakdown of what filetypes take up the most space"

[[get]]
kind = "install"

[[changelog]]
version = "0.1.0"
date = 2026-11-21
items = ["Initial public release"]