#:schema ../../schema/project.json
slug = "nessy-theme"
name = "nessy-theme"
category = "linux"
status = "active"
summary = "A dark, cool colour theme with a Loch Ness nod, for terminals and editors."
priority = 2
updated = 2026-10-13
version = "main"
tags = ["style"]
source = { host = "GitHub", url = "https://github.com/tnessy/nessy-theme" }
description = """
Peat-dark water, highland mist, heather, bracken and a pastel-green Nessie. Every config file is generated from one palette (`palette.toml`), so all the targets stay in step.

Targets: Alacritty, kitty, Vim and Neovim, VS Code, JetBrains IDEs and ConEmu. This site uses the same palette.
"""

[linux]
language = "Python"
needs = []

[[linux.install]]
method = "Get the files"
command = "git clone https://github.com/tnessy/nessy-theme && cd nessy-theme"
note = "The ready-made files are in `dist/`. Each target below copies one of them."

[[linux.install]]
method = "kitty"
command = "cp dist/kitty/nessy.conf ~/.config/kitty/nessy.conf"
note = "Add `include nessy.conf` to `kitty.conf`, then reload with `ctrl+shift+f5`."

[[linux.install]]
method = "Alacritty"
command = "cp dist/alacritty/nessy.toml ~/.config/alacritty/nessy.toml"
note = "In `alacritty.toml` add `[general]` with `import = [\"~/.config/alacritty/nessy.toml\"]`. On Alacritty before 0.14 use a top-level `import = [...]`."

[[linux.install]]
method = "Vim"
command = "mkdir -p ~/.vim/colors && cp dist/vim/colors/nessy.vim ~/.vim/colors/"
note = "In `.vimrc` add `syntax on` and `colorscheme nessy`."

[[linux.install]]
method = "Neovim"
command = "mkdir -p ~/.config/nvim/colors && cp dist/vim/colors/nessy.vim ~/.config/nvim/colors/"
note = "Add `vim.cmd.colorscheme(\"nessy\")` to `init.lua`. Optional lualine theme: copy `dist/vim/lua/lualine/themes/nessy.lua` to `~/.config/nvim/lua/lualine/themes/` and set `theme = \"nessy\"`."

[[linux.install]]
method = "VS Code"
steps = [
  "Copy the `dist/vscode` folder to `~/.vscode/extensions/nessy-theme`.",
  "Restart VS Code.",
  "Run Preferences: Color Theme and pick Nessy.",
]

[[linux.install]]
method = "JetBrains"
steps = [
  "Open Settings → Editor → Color Scheme.",
  "Click the ⚙ menu, choose Import Scheme…, and select `dist/jetbrains/Nessy.icls`.",
]
note = "Styles the editor only, not the IDE chrome. Terminal colours are listed in `dist/jetbrains/terminal-colors.txt` (Settings → Editor → Color Scheme → Console Colors)."

[[linux.install]]
method = "ConEmu (Windows only)"
steps = [
  "Close ConEmu.",
  "Open `dist/conemu/nessy-palette.xml` and copy the `<key name=\"Palette1\">` block.",
  "Paste it into the `<key name=\"Colors\">` section of `ConEmu.xml`, renumbering if `Palette1` is taken.",
  "Start ConEmu and pick Nessy in Settings → Features → Colors.",
]

[linux.usage]
synopsis = "python3 generate.py"
example = "python3 generate.py && xdg-open dist/showcase.html"
options = [
  { flag = "palette.toml", help = "edit the palette, then re-run generate.py to rebuild dist/" },
]

[[get]]
kind = "install"
