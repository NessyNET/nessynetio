# nessynet.io: IPv4 listeners only (the box has no global IPv6). No
# default_server, no http-level directives, HSTS without includeSubDomains, so
# this file is safe to drop onto a host that serves other sites.

server {
    listen 80;
    server_name nessynet.io www.nessynet.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://nessynet.io$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nessynet.io;

    ssl_certificate /etc/letsencrypt/live/nessynet.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nessynet.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:nessynet_tls:10m;
    ssl_session_tickets off;

    return 301 https://nessynet.io$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nessynet.io;

    ssl_certificate /etc/letsencrypt/live/nessynet.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nessynet.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:nessynet_tls:10m;
    ssl_session_tickets off;

    include snippets/nessynet-site.conf;
}
