# Setup step 7 only: HTTP, no certificate needed. Replaced by nessynet.io.conf
# once certbot has issued the certificate.
server {
    listen 80;
    server_name nessynet.io www.nessynet.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://nessynet.io$request_uri;
    }
}
