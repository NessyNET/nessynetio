# Catch-all for unknown Host names and bare-IP requests. Requires that this
# host serves only nessynet.io (design 3.6.2, coexistence).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
