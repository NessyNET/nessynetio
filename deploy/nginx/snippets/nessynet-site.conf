# Shared site body, included inside the apex 443 server block.
root /srv/nessynet/current;
index index.html;
absolute_redirect off;
server_tokens off;
charset utf-8;

access_log /var/log/nginx/nessynet/access.log;
error_log /var/log/nginx/nessynet/error.log;

gzip_static on;
gzip on;
gzip_vary on;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

# nginx 1.28 has no add_header_inherit: a location that calls add_header drops
# every header from the enclosing level. So the headers snippet is included at
# server level (for return/redirect/error responses) AND again in every
# location that sets Cache-Control.
include snippets/nessynet-headers.conf;

error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    include snippets/nessynet-headers.conf;
}

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include snippets/nessynet-headers.conf;
}

# ^~ prefix locations stop regex matching, so the hidden-file rules are
# repeated as a nested regex location inside each of them.
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/nessynet-headers.conf;

    location ~ (/\.|\.map$) {
        return 404;
    }
}

location ^~ /og/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/nessynet-headers.conf;

    location ~ (/\.|\.map$) {
        return 404;
    }
}

location ~ /\. {
    return 404;
}

location = /.build-meta.json {
    return 404;
}

location ~ \.map$ {
    return 404;
}
